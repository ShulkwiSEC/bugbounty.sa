name: publish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set version
        run: |
          BASE_VERSION=$(uv version --short)
          VERSION="${BASE_VERSION%.*}.${GITHUB_RUN_NUMBER}"
          uv version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: uv build

      - name: Check PyPI token
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "::error::Secret UV_PUBLISH_TOKEN is empty. Add it under Settings > Secrets and variables > Actions with this exact name, scoped to project 'bugbounty.sa' with Upload permission."
            exit 1
          fi

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" || gh release create "v$VERSION" --generate-notes --target "$GITHUB_SHA"
          gh release upload "v$VERSION" dist/* --clobber
